# https://flit.pypa.io/en/stable/pyproject_toml.html

[project]
name = "ckg_s2mw"
authors = [
	{ name="Darron Broad" },
]
readme = "README.md"
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
	"WikibaseIntegrator>=0.12",
	"lxml",
	"beautifulsoup4",
	"pypandoc",
	"python-magic",
	"mwclient",
	"cps-wb>=1.0.5",
	"xmltodict",
]
dynamic = [
	"version",
	"description"
]

[project.urls]
Documentation = "https://wiki.kewl.org/projects:s2mw"
#Source = "https://hg.kewl.org/pub/ckg_s2mw"

[project.scripts]
wordpress = "ckg_s2mw:wordpress.main"
gatsby    = "ckg_s2mw:gatsby.main"
mediawiki = "ckg_s2mw:mediawiki.main"
wbset     = "ckg_s2mw:wbset.main"
wikitext  = "ckg_s2mw:wikitext.main"
work      = "ckg_s2mw:work.main"
fix       = "ckg_s2mw:fix.main"

[tool.flit.sdist]
include = [
	"Makefile"
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"
